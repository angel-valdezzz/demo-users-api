[project]
name = "demo-users-api"
version = "0.1.0"
description = "Authenticated, temporary users API for automation demonstrations"
requires-python = ">=3.12,<4"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "email-validator>=2,<3"]
[tool.poetry]
packages = [{include = "demo_api", from = "src"}]
requires-poetry = ">=2.5.1,<3"
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.16,<1"]
[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
